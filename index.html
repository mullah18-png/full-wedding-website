<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M & A - Nikkah & Wedding Reception</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blush: #fcf3f2;
            --blush-dark: #f0dedc;
            --lavender: #f4f1f8;
            --champagne-gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --charcoal: #2c2c2c;
            --deep-maroon: #5c1d24;
            --white: #ffffff;
            --transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--blush);
            color: var(--charcoal);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* Typography Helpers */
        .script-font {
            font-family: 'Great Vibes', cursive;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }

        .deep-maroon-text {
            color: var(--deep-maroon) !important;
        }

        .black-text {
            color: #000000 !important;
        }

        /* Click to View Landing Overlay */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--blush) 0%, var(--lavender) 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #auth-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .auth-card {
            background: var(--white);
            padding: 60px 30px;
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
        }

        .auth-card h2 {
            font-size: 4.5rem;
            margin: 20px 0;
            font-weight: 400;
            color: var(--deep-maroon);
            line-height: 1.1;
        }

        .auth-card p {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .auth-card button {
            width: 100%;
            padding: 15px;
            background: var(--charcoal);
            color: var(--white);
            border: none;
            border-radius: 2px;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .auth-card button:hover, .auth-card button:active {
            background: var(--deep-maroon);
        }

        /* Multi-Page Website Container */
        #website-container {
            position: absolute;
            inset: 0;
            background: var(--blush);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #website-container.active {
            opacity: 1;
            visibility: visible;
        }

        /* Navigation Header & Mobile Menu */
        header {
            position: sticky;
            top: 0;
            background: rgba(252, 243, 242, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--blush-dark);
            z-index: 900;
        }

        .nav-logo {
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: var(--deep-maroon);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--charcoal);
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--champagne-gold);
        }

        /* Mobile Hamburger Toggle */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            z-index: 950;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: var(--deep-maroon);
            transition: all 0.3s ease;
        }

        /* Section Spacing & Flow */
        .page-section {
            min-height: auto;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .section-inner {
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2.section-title {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 400;
            line-height: 1.2;
            text-align: center;
        }

        p.section-subtitle {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--champagne-gold);
            margin-bottom: 45px;
            padding: 0 10px;
            text-align: center;
        }

        .subtitle-black {
            color: #000000 !important;
        }

        /* Aesthetic Minimalist Corner Frames */
        .floral-frame {
            position: relative;
            background: var(--white);
            padding: 60px 45px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid rgba(92, 29, 36, 0.15);
            width: 100%;
        }

        .floral-corner {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
            border: 1px solid var(--deep-maroon);
            opacity: 0.6;
        }

        .corner-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .corner-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
        .corner-br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        /* Welcome Page Styles */
        .hero-names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: var(--deep-maroon);
            margin: 15px 0;
            line-height: 1.2;
            text-transform: uppercase;
            text-align: center;
        }

        /* Countdown Grid Styles */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
            flex-wrap: wrap;
            width: 100%;
        }

        .countdown-box {
            background: #faf8f7;
            border: 1px solid var(--blush-dark);
            padding: 20px;
            border-radius: 2px;
            flex: 1;
            min-width: 150px;
            text-align: center;
        }

        .countdown-days {
            font-size: 2.2rem;
            font-family: 'Cormorant Garamond', serif;
            color: var(--champagne-gold);
            font-weight: 600;
        }

        .countdown-label {
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }

        /* Timeline */
        .timeline-container {
            position: relative;
            max-width: 100%;
            margin: 35px auto 25px auto;
            padding-left: 25px;
            border-left: 2px solid var(--champagne-gold);
            text-align: left;
        }

        .timeline-event {
            position: relative;
            margin-bottom: 35px;
        }

        .timeline-event:last-child {
            margin-bottom: 0;
        }

        .timeline-event::before {
            content: '';
            position: absolute;
            left: -31px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--champagne-gold);
            border: 2px solid var(--white);
        }

        .timeline-time {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--champagne-gold);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .timeline-title {
            font-size: 1.4rem;
            font-family: 'Cormorant Garamond', serif;
            margin-bottom: 4px;
            color: var(--charcoal);
        }

        .timeline-desc {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
        }

        /* Slideshow Venue Styling */
        .venue-slideshow-container {
            width: 100%;
            height: 280px;
            background: var(--blush-dark);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--blush-dark);
            position: relative;
        }

        .venue-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .venue-slide.active {
            opacity: 1;
        }

        .venue-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slideshow-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.3s;
        }

        .dot.active {
            background: var(--white);
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .gallery-item {
            height: 340px;
            background: var(--blush-dark);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            font-size: 1rem;
            color: var(--deep-maroon);
            border: 2px solid var(--deep-maroon);
            text-align: center;
            padding: 0 15px;
        }

        /* RSVP Form & Attendees Dynamic Styling */
        .rsvp-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 100%;
            margin: 0 auto;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size
